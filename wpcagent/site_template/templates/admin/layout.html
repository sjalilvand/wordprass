<!DOCTYPE html>
<html lang="{{ LANG }}" dir="{{ L['dir'] }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — {{ site_name }}</title>
<style>
:root { --brand: {{ theme_color }}; --bg:#f1f5f9; --card:#fff; --text:#1e293b; --muted:#64748b; --line:#e2e8f0; }
body { margin:0; font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.8; }
a { color:var(--brand); text-decoration:none; }
input, textarea, select { width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:.95rem; box-sizing:border-box; }
label { display:block; margin:14px 0 6px; font-weight:600; font-size:.92em; }
.btn { display:inline-block; background:var(--brand); color:#fff; border:0; padding:10px 24px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:.95rem; font-weight:700; }
.btn.ghost { background:transparent; color:var(--brand); border:1.5px solid var(--brand); }
.btn.danger { background:#dc2626; }
.topbar { background:#0f172a; color:#fff; padding:12px 22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.topbar a { color:#cbd5e1; margin-inline-start:14px; }
.topbar a.on { color:#fff; font-weight:700; }
.wrap { max-width:1100px; margin:24px auto; padding:0 18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:18px; }
table { width:100%; border-collapse:collapse; font-size:.92em; }
th, td { padding:10px 12px; text-align:start; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-size:.85em; text-transform:uppercase; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:center; }
.stat .v { font-size:1.9rem; font-weight:800; color:var(--brand); }
.stat .k { color:var(--muted); font-size:.85em; }
.flash { background:#dcfce7; border:1px solid #16a34a; color:#14532d; padding:12px 16px; border-radius:10px; margin-bottom:14px; }
.msg { max-width:70%; padding:8px 12px; border-radius:12px; font-size:.9em; margin-bottom:6px; }
.msg.visitor { background:#e2e8f0; }
.msg.bot { background:color-mix(in srgb, var(--brand) 14%, transparent); margin-inline-start:auto; }
.msg.admin { background:#dcfce7; margin-inline-start:auto; }
.chatpane { display:grid; grid-template-columns:320px 1fr; gap:16px; }
@media (max-width:800px){ .chatpane { grid-template-columns:1fr; } }
.convs a { display:block; padding:9px 12px; border-bottom:1px dashed var(--line); font-size:.9em; }
.convs a.on { background:color-mix(in srgb, var(--brand) 12%, transparent); border-radius:8px; }
.toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="topbar">
  <div><b>{{ site_name }}</b> — Admin</div>
  <div>
    <a href="/admin" class="{{ 'on' if request.path == '/admin' }}">Dashboard</a>
    <a href="/admin/content?type=post" class="{{ 'on' if '/admin/content' in request.path and request.args.get('type','post')=='post' }}">Posts</a>
    <a href="/admin/content?type=page" class="{{ 'on' if '/admin/content' in request.path and request.args.get('type')=='page' }}">Pages</a>
    <a href="/admin/comments" class="{{ 'on' if request.path == '/admin/comments' }}">Comments</a>
    <a href="/admin/chat" class="{{ 'on' if request.path == '/admin/chat' }}">Chat</a>
    <a href="/admin/messages" class="{{ 'on' if request.path == '/admin/messages' }}">Messages</a>
    <a href="/admin/media" class="{{ 'on' if request.path == '/admin/media' }}">Media</a>
    <a href="/admin/settings" class="{{ 'on' if request.path == '/admin/settings' }}">Settings</a>
    <a href="/" target="_blank">View site ↗</a>
    <a href="/admin/logout">Logout</a>
  </div>
</div>
<div class="wrap">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block admin %}{% endblock %}
</div>
</body>
</html>
