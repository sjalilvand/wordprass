{% extends "admin/layout.html" %}
{% block admin %}
<div class="toolbar">
  <a class="btn ghost" href="/admin/content/new?type={{ ctype }}">+ New {{ ctype }}</a>
</div>
<div class="card">
  <table>
    <tr><th>ID</th><th>Title</th><th>Slug</th><th>Status</th><th>Created</th><th style="width:200px"></th></tr>
    {% for r in items %}
    <tr>
      <td>{{ r['id'] }}</td>
      <td>{{ r['title'] }}</td>
      <td><code>{{ r['slug'] }}</code></td>
      <td>{{ r['status'] }}</td>
      <td>{{ r['created_at'] }}</td>
      <td>
        <a class="btn ghost" href="/admin/content/{{ r['id'] }}/edit">Edit</a>
        <form method="post" action="/admin/content/{{ r['id'] }}/delete" style="display:inline" onsubmit="return confirm('Delete this item?')">
          <button class="btn danger" type="submit">Del</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
