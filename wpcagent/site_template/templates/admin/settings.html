{% extends "admin/layout.html" %}
{% block admin %}
<div class="card" style="max-width:680px">
  <h2>Site settings (personalization)</h2>
  <form method="post">
    <label>Site name</label>
    <input name="site_name" value="{{ get_setting('site_name', site_name) }}">
    <label>Tagline</label>
    <input name="tagline" value="{{ get_setting('tagline', site_tagline) }}">
    <label>Theme color (personalization)</label>
    <input name="theme_color" type="color" value="{{ get_setting('theme_color', theme_color) }}" style="height:44px;padding:4px">
    <label>Chat greeting (first bot message)</label>
    <input name="chat_greeting" value="{{ get_setting('chat_greeting', '') }}">
    <label>Chat fallback (when nothing found)</label>
    <input name="chat_fallback" value="{{ get_setting('chat_fallback', '') }}">
    <label>FAQ pairs — each line: keywords1|keywords2||answer</label>
    <textarea name="faq_pairs" rows="5">{{ get_setting('faq_pairs', '') }}</textarea>
    <p><button class="btn">Save settings</button></p>
  </form>
</div>
{% endblock %}
