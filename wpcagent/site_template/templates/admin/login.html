<!DOCTYPE html>
<html lang="{{ LANG }}" dir="{{ L['dir'] }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — {{ site_name }}</title>
<style>
body { margin:0; font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; background:linear-gradient(140deg,#0f172a,#1e293b); min-height:100vh; display:grid; place-items:center; color:#e6edf7; }
.box { background:rgba(30,41,59,.9); border:1px solid #334155; border-radius:18px; padding:36px 32px; width:360px; max-width:92vw; }
h1 { font-size:1.3rem; margin:0 0 4px; }
p.sub { color:#94a3b8; font-size:.88rem; margin:0 0 18px; }
input { width:100%; padding:12px 14px; border:1.5px solid #475569; border-radius:10px; background:#0f172a; color:#fff; font-family:inherit; font-size:.95rem; box-sizing:border-box; margin-bottom:14px; }
button { width:100%; padding:12px; background:linear-gradient(135deg,#6366f1,#38bdf8); border:0; border-radius:10px; color:#fff; font-weight:700; font-family:inherit; font-size:1rem; cursor:pointer; }
.err { background:rgba(248,113,113,.15); border:1px solid #f87171; color:#fca5a5; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:.9rem; }
</style>
</head>
<body>
<div class="box">
  <h1>{{ site_name }}</h1>
  <p class="sub">Admin panel — ورود مدیر</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <input name="username" placeholder="Username" required autocomplete="username">
    <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Login / ورود</button>
  </form>
</div>
</body>
</html>
