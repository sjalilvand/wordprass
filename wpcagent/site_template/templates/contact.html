{% extends "base.html" %}
{% block title %}{{ t('contact_title') }} — {{ site_name }}{% endblock %}
{% block content %}
<div class="article" style="max-width:640px;margin:0 auto">
  <h1>{{ t('contact_title') }}</h1>
  <form method="post" action="/contact">
    <label for="n">{{ t('msg_name') }}</label>
    <input id="n" name="name" required maxlength="100">
    <label for="e">{{ t('msg_email') }}</label>
    <input id="e" name="email" type="email" maxlength="150">
    <label for="b">{{ t('msg_body') }}</label>
    <textarea id="b" name="body" rows="6" required maxlength="4000"></textarea>
    <p><button class="btn" type="submit">{{ t('contact_send') }}</button></p>
  </form>
</div>
{% endblock %}
