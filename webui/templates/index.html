<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordPress Clone Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b1220; --bg2: #101b33;
    --card: rgba(30, 41, 59, .82); --card-solid: #1e293b;
    --line: rgba(148, 163, 184, .22);
    --text: #e6edf7; --muted: #94a3b8;
    --accent: #38bdf8; --accent2: #0ea5e9; --accent3: #818cf8;
    --ok: #34d399; --err: #f87171; --warn: #fbbf24;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; padding: 20px 16px 44px;
    background:
      radial-gradient(1100px 500px at 85% -8%, rgba(56,189,248,.16), transparent 60%),
      radial-gradient(900px 460px at 8% 108%, rgba(129,140,248,.14), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    line-height: 1.9; font-size: 15px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 13px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(14,165,233,.35);
  }
  .logo svg { width: 26px; height: 26px; }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: .2px; }
  .brand .tag { font-size: 12px; color: var(--muted); margin: 0; }
  .langs { display: flex; gap: 6px; background: rgba(15,23,42,.6); padding: 5px; border-radius: 12px; border: 1px solid var(--line); }
  .langs button {
    all: unset; cursor: pointer; padding: 5px 13px; border-radius: 9px;
    font-size: 13px; font-weight: 600; color: var(--muted); font-family: inherit;
    transition: all .2s;
  }
  .langs button.on { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #04121d; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px; margin-bottom: 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(2,6,23,.45);
  }
  .hidden { display: none !important; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 500; }
  input[type=text] {
    width: 100%; padding: 13px 15px; border-radius: 12px; font-size: 15px;
    border: 1px solid var(--line); background: rgba(11,18,32,.75); color: var(--text);
    font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }

  .opts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    border: 1px solid var(--line); border-radius: 12px; font-size: 13.5px;
    background: rgba(11,18,32,.55); cursor: pointer; user-select: none;
    transition: all .2s;
  }
  .chip:hover { border-color: rgba(56,189,248,.55); }
  .chip input { accent-color: var(--accent2); transform: scale(1.15); }
  .chip:has(input:checked) { border-color: rgba(56,189,248,.7); background: rgba(14,165,233,.12); }

  .row2 { display: flex; gap: 12px; flex-wrap: wrap; }
  .row2 > div { flex: 1; min-width: 220px; }

  .btn-main {
    width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 13px;
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    color: #04121d; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: transform .15s, opacity .2s;
    box-shadow: 0 8px 24px rgba(14,165,233,.35);
  }
  .btn-main:hover { transform: translateY(-1px); }
  .btn-main:disabled { opacity: .55; cursor: wait; transform: none; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; display: flex; gap: 7px; align-items: center; }
  .note svg { width: 15px; height: 15px; flex: 0 0 auto; }

  /* ---------- progress ---------- */
  .prog-head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .ring-wrap { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(148,163,184,.18); stroke-width: 11; }
  .ring-fg { fill: none; stroke: url(#grad); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-num {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 30px; font-weight: 800; letter-spacing: .5px;
  }
  .ring-num small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .prog-side { flex: 1; min-width: 240px; }
  .prog-side .state { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .prog-side .url { font-size: 12.5px; color: var(--muted); direction: ltr; text-align: start; word-break: break-all; }

  .stages { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .stage {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px;
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); background: rgba(11,18,32,.5); transition: all .3s;
  }
  .stage .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .stage.active { color: #04121d; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); border-color: transparent; }
  .stage.active .dot { background: #04121d; }
  .stage.past { color: var(--ok); border-color: rgba(52,211,153,.4); }
  .stage.past .dot { background: var(--ok); }

  #log {
    background: rgba(11,18,32,.8); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; height: 190px; overflow-y: auto; font-size: 13px;
    color: var(--muted); margin-top: 16px; white-space: pre-wrap;
  }
  #log .ln b { color: var(--accent); font-weight: 600; }

  /* ---------- result ---------- */
  .banner-ok {
    display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(52,211,153,.16), rgba(52,211,153,.06));
    border: 1px solid rgba(52,211,153,.45); margin-bottom: 16px;
  }
  .banner-ok svg { width: 30px; height: 30px; flex: 0 0 auto; }
  .banner-ok .t { font-size: 16px; font-weight: 800; color: var(--ok); }
  .banner-ok .d { font-size: 13px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: rgba(11,18,32,.6); border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px; text-align: center; }
  .stat .v { font-size: 21px; font-weight: 800; color: var(--accent); }
  .stat .k { font-size: 12px; color: var(--muted); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px;
    text-decoration: none; font-weight: 700; font-size: 14px; font-family: inherit;
    border: 1px solid var(--line); background: rgba(11,18,32,.6); color: var(--text); cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { border-color: rgba(56,189,248,.6); }
  .btn.primary { background: linear-gradient(135deg, var(--ok), #10b981); color: #052e1c; border: 0; }
  .btn svg { width: 17px; height: 17px; }

  .guide h3 { margin: 6px 0 14px; font-size: 16px; display: flex; align-items: center; gap: 9px; }
  .guide h3 svg { width: 20px; height: 20px; }
  .step { display: flex; gap: 13px; padding: 13px 0; border-top: 1px dashed var(--line); }
  .step:first-of-type { border-top: 0; }
  .stepn {
    width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    color: #04121d; font-weight: 800; display: grid; place-items: center; font-size: 14px;
  }
  .stepb { flex: 1; min-width: 0; }
  .stepb .t { font-weight: 700; font-size: 14px; }
  .stepb .d { font-size: 13px; color: var(--muted); margin: 3px 0 8px; }
  .cmdbox {
    display: flex; align-items: stretch; gap: 0; background: #0a0f1e;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .cmdbox code {
    flex: 1; padding: 9px 12px; font-family: Consolas, Monaco, monospace; font-size: 12.5px;
    color: #7dd3fc; direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-all;
  }
  .cmdbox button {
    all: unset; cursor: pointer; padding: 0 13px; display: grid; place-items: center;
    background: rgba(56,189,248,.1); border-inline-start: 1px solid var(--line); transition: background .2s;
  }
  .cmdbox button:hover { background: rgba(56,189,248,.22); }
  .cmdbox svg { width: 15px; height: 15px; }
  .copybtn { font-size: 11.5px; }

  .err-banner {
    display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-radius: 13px;
    background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.4); color: var(--err);
    font-weight: 700;
  }

  @media (max-width: 560px) {
    .prog-head { gap: 14px; }
    .ring-wrap { width: 104px; height: 104px; }
    .ring-num { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v9a2.5 2.5 0 0 1-2.5 2.5H12l-4.2 3.6c-.7.6-1.8.1-1.8-.8V17h-.5A2.5 2.5 0 0 1 3 14.5v-9Z" fill="#04121d"/><circle cx="8" cy="10" r="1.4" fill="#0ea5e9"/><circle cx="12" cy="10" r="1.4" fill="#0ea5e9"/><circle cx="16" cy="10" r="1.4" fill="#0ea5e9"/></svg>
      </div>
      <div>
        <h1 id="t-title" data-i="title">ایجنت کلون سایت‌های وردپرس</h1>
        <p class="tag" id="t-tagline" data-i="tagline">…</p>
      </div>
    </div>
    <div class="langs">
      <button id="lang-fa" onclick="setLang('fa')">فارسی</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
      <button id="lang-ar" onclick="setLang('ar')">عربي</button>
    </div>
  </div>

  <!-- ===== screen 1 : form ===== -->
  <div class="card" id="formCard">
    <label class="lbl" for="url" data-i="urlLabel"></label>
    <input type="text" id="url" data-ph="urlPh" autocomplete="off" spellcheck="false">

    <div class="row2">
      <div>
        <label class="lbl" for="limit" data-i="optLimit"></label>
        <input type="text" id="limit" data-ph="optLimitPh" inputmode="numeric">
      </div>
      <div>
        <label class="lbl" for="max_pages" data-i="optPages"></label>
        <input type="text" id="max_pages" value="100" inputmode="numeric">
      </div>
    </div>

    <div class="opts">
      <label class="chip"><input type="checkbox" id="mirror" checked><span data-i="optMirror"></span></label>
      <label class="chip"><input type="checkbox" id="api" checked><span data-i="optApi"></span></label>
      <label class="chip"><input type="checkbox" id="wxr" checked><span data-i="optWxr"></span></label>
      <label class="chip"><input type="checkbox" id="zip" checked><span data-i="optZip"></span></label>
    </div>

    <button class="btn-main" id="startBtn" onclick="startJob()" data-i="start"></button>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i="note"></span>
    </div>
  </div>

  <!-- ===== screen 2 : progress ===== -->
  <div class="card hidden" id="progCard">
    <div class="prog-head">
      <div class="ring-wrap">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="66" cy="66" r="57"></circle>
          <circle class="ring-fg" id="ringFg" cx="66" cy="66" r="57" stroke-dasharray="358.1" stroke-dashoffset="358.1"></circle>
        </svg>
        <div class="ring-num"><div><span id="pctNum">0</span>%<br><small id="pctStage">…</small></div></div>
      </div>
      <div class="prog-side">
        <div class="state" id="stateLine">…</div>
        <div class="url" id="targetUrl"></div>
      </div>
    </div>
    <div class="stages" id="stages"></div>
    <div id="log"></div>
  </div>

  <!-- ===== screen 3 : result ===== -->
  <div class="card hidden" id="resultCard">
    <div class="banner-ok" id="okBanner">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#34d399" opacity=".2"/><path d="m7.5 12.5 3 3 6-6" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <div class="t" data-i="doneTitle"></div>
        <div class="d" data-i="doneMsg"></div>
      </div>
    </div>
    <div class="err-banner hidden" id="errBanner"><span data-i="error"></span></div>

    <label class="lbl" data-i="stats"></label>
    <div class="stats" id="statsBox"></div>

    <div class="actions">
      <a class="btn primary" id="dlBtn" href="#" download>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i="downloadZip"></span>
      </a>
      <a class="btn" id="mirrorPreviewBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/></svg>
        <span data-i="previewMirror"></span>
      </a>
      <button class="btn" id="newBtn" onclick="resetAll()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i="newClone"></span>
      </button>
    </div>
  </div>

  <div class="card hidden guide" id="guideCard">
    <h3>
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v14.5a1.5 1.5 0 0 1-1.5 1.5H6.5A2.5 2.5 0 0 1 4 17.5v-12Z" stroke="#38bdf8" stroke-width="1.7"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span data-i="guideTitle"></span>
    </h3>

    <div class="step">
      <div class="stepn">1</div>
      <div class="stepb">
        <div class="t" data-i="g1t"></div>
        <div class="d" data-i="g1d"></div>
        <div class="cmdbox"><code id="cmd1">mirror\index.html</code>
          <button onclick="copyCmd('cmd1')" title="copy"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>

    <div class="step">
      <div class="stepn">2</div>
      <div class="stepb">
        <div class="t" data-i="g2t"></div>
        <div class="d" data-i="g2d"></div>
        <div class="cmdbox"><code id="cmd2">cd "<mirror path>"
python -m http.server 8080</code>
          <button onclick="copyCmd('cmd2')" title="copy"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </div>
        <div class="d" style="margin-top:6px" data-i="g2url"></div>
        <div class="d" style="margin-top:6px;color:var(--warn)" data-i="g2warn"></div>
      </div>
    </div>

    <div class="step">
      <div class="stepn">3</div>
      <div class="stepb">
        <div class="t" data-i="g3t"></div>
        <div class="d" data-i="g3d"></div>
        <div class="cmdbox"><code id="cmd3">wxr\export.xml</code>
          <button onclick="copyCmd('cmd3')" title="copy"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>

    <div class="step">
      <div class="stepn">4</div>
      <div class="stepb">
        <div class="t" data-i="g4t"></div>
        <div class="d" data-i="g4d"></div>
        <div class="cmdbox"><code id="cmd4">output</code>
          <button onclick="copyCmd('cmd4')" title="copy"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== step 4 : build dynamic site ===== -->
  <div class="card hidden" id="buildCard">
    <h3>
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-i="bTitle"></span>
    </h3>
    <p class="d" data-i="bIntro"></p>

    <div class="row2">
      <div>
        <label class="lbl" for="bName" data-i="bName"></label>
        <input type="text" id="bName" autocomplete="off">
      </div>
      <div>
        <label class="lbl" for="bTagline" data-i="bTagline"></label>
        <input type="text" id="bTagline" autocomplete="off">
      </div>
    </div>

    <label class="lbl" for="bDir" data-i="bDir"></label>
    <input type="text" id="bDir" data-ph="bDirPh" spellcheck="false">

    <label class="lbl" data-i="bLangs"></label>
    <div class="opts">
      <label class="chip"><input type="checkbox" id="langFa" checked><span>فارسی</span></label>
      <label class="chip"><input type="checkbox" id="langEn"><span>English</span></label>
      <label class="chip"><input type="checkbox" id="langAr"><span>عربي</span></label>
    </div>

    <div class="row2">
      <div>
        <label class="lbl" for="bAdminUser" data-i="bAdminUser"></label>
        <input type="text" id="bAdminUser" value="admin">
      </div>
      <div>
        <label class="lbl" for="bAdminPass" data-i="bAdminPass"></label>
        <input type="password" id="bAdminPass" autocomplete="new-password">
      </div>
    </div>

    <div class="row2">
      <div>
        <label class="lbl" for="bColor" data-i="bColor"></label>
        <input type="color" id="bColor" value="#4f46e5" style="height:42px;padding:4px">
      </div>
      <div style="display:flex;align-items:flex-end">
        <div class="opts" style="margin-bottom:10px">
          <label class="chip"><input type="checkbox" id="bChat" checked><span data-i="bChatOpt"></span></label>
        </div>
      </div>
    </div>

    <div class="row2">
      <div>
        <label class="lbl" for="bGit" data-i="bGit"></label>
        <input type="text" id="bGit" data-ph="bGitPh" spellcheck="false" dir="ltr">
      </div>
      <div>
        <label class="lbl" for="bToken" data-i="bToken"></label>
        <input type="password" id="bToken" data-ph="bTokenPh" autocomplete="off" dir="ltr">
      </div>
    </div>

    <button class="btn-main" id="buildBtn" onclick="startBuild()" data-i="bStart"></button>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i="bNote"></span>
    </div>
  </div>

  <!-- ===== build progress ===== -->
  <div class="card hidden" id="buildProgCard">
    <div class="prog-head">
      <div class="ring-wrap">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle class="ring-bg" cx="66" cy="66" r="57"></circle>
          <circle class="ring-fg" id="bRing" cx="66" cy="66" r="57" stroke-dasharray="358.1" stroke-dashoffset="358.1" stroke="#818cf8"></circle>
        </svg>

    bAgain: "إعادة البناء بإعدادات جديدة",

    bR1d: "زر «تشغيل ومعاينة مباشرة» يشغّل الموقع فوراً على حاسوبك ويفتحه في تب جديد.",

    bInvalidForm: "اسم الموقع ومسار المشروع وكلمة مرور المدير (٤ أحرف) مطلوبة",
    bMsg: {

    },
    stages: {
      detect: "اكتشاف ووردبريس",
      api: "جلب المحتوى",
      media: "تنزيل الوسائط",

    },
    ep: {

      tags: "الوسوم", comments: "التعليقات", users: "المستخدمون", menus: "القوائم",
      "menu-items": "عناصر القوائم"
    },
    msg: {
      detect: "اكتشاف ووردبريس…",
      api: "جلب المحتوى من REST API…",

const STAGES = [
  { key: "detect", from: 0,  to: 8  },
  { key: "api",    from: 8,  to: 30 },
  { key: "media",  from: 30, to: 46 },
  { key: "mirror", from: 46, to: 88 },
  { key: "wxr",    from: 88, to: 94 },
  { key: "report", from: 94, to: 97 },
  { key: "zip",    from: 97, to: 100.1 }
];

let LANG = localStorage.getItem("wpc_lang") || "fa";
let L = I18N[LANG];
let currentJob = null;
let pollTimer = null;
let lastMsgKey = "";

/* ================== language ================== */
function setLang(lang) {
  LANG = lang; L = I18N[lang];
  localStorage.setItem("wpc_lang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  document.querySelectorAll("[data-i]").forEach(el => {
    const k = el.getAttribute("data-i");
    if (L[k] !== undefined) el.textContent = L[k];
  });
  document.querySelectorAll("[data-ph]").forEach(el => {
    const k = el.getAttribute("data-ph");
    if (L[k] !== undefined) el.placeholder = L[k];
  });
  document.title = L.title;
  ["fa", "en", "ar"].forEach(x => {
    document.getElementById("lang-" + x).classList.toggle("on", x === lang);
  });
  renderStages();
  if (lastMsgKey) document.getElementById("stateLine").textContent = localizeMsg(lastMsgKey);
  if (currentJob === null) {
    document.getElementById("pctStage").textContent = "";
    document.getElementById("stateLine").textContent = "";
  }
}

/* ================== helpers ================== */
function localizeMsg(key) {
  if (!key) return "";
  if (L.msg[key]) return L.msg[key];
  if (L.bMsg && L.bMsg[key]) return L.bMsg[key];
  if (key.startsWith("build_error:")) return (L.bMsg["build_error"] || key) + " — " + key.slice(12);
  if (key.startsWith("api:")) {
    const ep = key.slice(4);
    return (L.msg.api || "") + " " + (L.ep[ep] || ep);
  }
  if (key.startsWith("media:")) {
    const n = key.slice(6);
    return (L.msg.media || "") + " " + n;
  }
  if (key.startsWith("mirror_page:")) return (L.stages.mirror || "") + " — #" + key.split(":")[1];
  if (key.startsWith("mirror_asset:")) return (L.stages.mirror || "") + " — #" + key.split(":")[1];
  return key;
}

function stageOf(p) {
  for (const s of STAGES) if (p < s.to) return s.key;
  return "zip";
}

function renderStages() {
  const p = window._percent || 0;
  const cur = stageOf(p);
  const box = document.getElementById("stages");
  box.innerHTML = "";
  for (const s of STAGES) {
    const d = document.createElement("div");
    d.className = "stage" + (s.key === cur ? " active" : (p >= s.to ? " past" : ""));
    d.innerHTML = '<span class="dot"></span>' + (L.stages[s.key] || s.key);
    box.appendChild(d);
  }
}

function copyCmd(id) {
  const txt = document.getElementById(id).textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btns = document.querySelectorAll(".cmdbox button");
    btns.forEach(() => {});
    const box = document.getElementById(id).parentElement.querySelector("button");
    if (box) { box.title = L.copied; box.style.background = "rgba(52,211,153,.25)"; }
    setTimeout(() => { if (box) box.style.background = ""; }, 900);
  });
}

/* ================== flow ================== */
function startJob() {
  const url = document.getElementById("url").value.trim();
  if (!url) { alert(L.emptyUrl); return; }
  const fd = new FormData();
  fd.append("url", url);
  fd.append("limit", document.getElementById("limit").value);
  fd.append("max_pages", document.getElementById("max_pages").value);
  fd.append("mirror", document.getElementById("mirror").checked ? "on" : "");
  fd.append("api", document.getElementById("api").checked ? "on" : "");
  fd.append("wxr", document.getElementById("wxr").checked ? "on" : "");
  fd.append("zip", document.getElementById("zip").checked ? "on" : "");

  document.getElementById("startBtn").disabled = true;
  document.getElementById("formCard").classList.add("hidden");
  document.getElementById("progCard").classList.remove("hidden");
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("guideCard").classList.add("hidden");
  document.getElementById("log").textContent = "";
  document.getElementById("targetUrl").textContent = url;
  window._percent = 0;
  renderStages();

  fetch("/start", { method: "POST", body: fd })
    .then(r => r.json())
    .then(d => {
      if (d.job_id) { currentJob = d.job_id; poll(); }
      else { showError(d.error || "error"); }
    })
    .catch(() => showError("error"));
}

function poll() {
  pollTimer = setInterval(() => {
    fetch("/status/" + currentJob)
      .then(r => r.json())
      .then(d => updateProgress(d))
      .catch(() => {});
  }, 1100);
}

function updateProgress(d) {
  const p = d.percent || 0;
  window._percent = p;
  const ring = document.getElementById("ringFg");
  const C = 2 * Math.PI * 57;
  ring.setAttribute("stroke-dashoffset", String(C * (1 - p / 100)));
  document.getElementById("pctNum").textContent = p;
  document.getElementById("pctStage").textContent =
    d.status === "running" ? (L.stages[stageOf(p)] || "") : L.msg.done;

  renderStages();

  if (d.log && d.log.length) {
    lastMsgKey = d.log[d.log.length - 1];
    document.getElementById("stateLine").textContent =
      d.status === "running" ? (L.running + " — " + localizeMsg(lastMsgKey))
      : d.status === "done" ? L.msg.done : L.error;
    const lg = document.getElementById("log");
    lg.innerHTML = d.log.map(k => '<div class="ln"><b>' + String(p).padStart(3) + '%</b> | ' +
      localizeMsg(k).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</div>").join("");
    lg.scrollTop = lg.scrollHeight;
  }

  if (d.done) {
    clearInterval(pollTimer);
    document.getElementById("startBtn").disabled = false;
    if (d.status === "done" && d.summary) {
      showResult(d.summary);
    } else {
      showError("error");
    }
  }
}

function showResult(s) {
  document.getElementById("progCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");
  document.getElementById("guideCard").classList.remove("hidden");
  document.getElementById("errBanner").classList.add("hidden");
  document.getElementById("okBanner").classList.remove("hidden");

  const c = s.counts || {}, m = s.mirror || {};
  const rows = [
    [c.posts || 0, L.stPosts],
    [c.pages || 0, L.stPages],
    [c.media || 0, L.stMedia],
    [c.categories || 0, L.stCat],
    [m.pages || 0, L.stMirror],
    [m.assets || 0, L.stAssets],
    [s.wxr_items || 0, L.stWxr],
  ];
  const box = document.getElementById("statsBox");
  box.innerHTML = rows.map(r =>
    '<div class="stat"><div class="v">' + r[0] + '</div><div class="k">' + r[1] + "</div></div>"
  ).join("");

  if (s.zip_ready) {
    document.getElementById("dlBtn").href = "/download/" + currentJob;
    document.getElementById("dlBtn").classList.remove("hidden");
  } else {
    document.getElementById("dlBtn").classList.add("hidden");
  }

  const mp = document.getElementById("mirrorPreviewBtn");
  if (mp) mp.href = "/preview-mirror/" + currentJob + "/";

  const root = (s.root || "output").replace(/\\/g, "\\\\");
  document.getElementById("cmd1").textContent = root + (L.dir === "rtl" ? "\\mirror\\index.html" : "/mirror/index.html");
  document.getElementById("cmd2").textContent =
    'cd "' + root + (L.dir === "rtl" ? "\\mirror" : "/mirror") + '"\npython -m http.server 8080';
  document.getElementById("cmd3").textContent = root + (L.dir === "rtl" ? "\\wxr\\export.xml" : "/wxr/export.xml");
  document.getElementById("cmd4").textContent = root;

  // کارت ساخت سایت پویا فقط پس از پایان کلون نمایش داده می‌شود
  document.getElementById("buildCard").classList.remove("hidden");
  if (!document.getElementById("bName").value) {
    document.getElementById("bName").value = s.site_name || "";
  }
}

function showError(key) {
  clearInterval(pollTimer);
  document.getElementById("startBtn").disabled = false;
  document.getElementById("progCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");
  document.getElementById("guideCard").classList.add("hidden");
  document.getElementById("okBanner").classList.add("hidden");
  document.getElementById("errBanner").classList.remove("hidden");
  const msg = L[key] || L.error;
  document.querySelector("#errBanner span").textContent = msg;
}

function resetAll() {
  currentJob = null;
  window._percent = 0;
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("guideCard").classList.add("hidden");
  document.getElementById("progCard").classList.add("hidden");
  document.getElementById("buildCard").classList.add("hidden");
  document.getElementById("buildProgCard").classList.add("hidden");
  document.getElementById("buildResultCard").classList.add("hidden");
  document.getElementById("formCard").classList.remove("hidden");
}

/* ================== step 4 : build dynamic site ================== */
let buildId = null;
let buildTimer = null;
let lastBuildMsg = "";

function startBuild() {
  if (!currentJob) return;
  const name = document.getElementById("bName").value.trim();
  const dir = document.getElementById("bDir").value.trim();
  const pass = document.getElementById("bAdminPass").value;
  if (!name || !dir || pass.length < 4) {
    alert(L.bInvalidForm);
    return;
  }
  const langs = [];
  if (document.getElementById("langFa").checked) langs.push("fa");
  if (document.getElementById("langEn").checked) langs.push("en");
  if (document.getElementById("langAr").checked) langs.push("ar");
  if (!langs.length) langs.push("fa");

  const fd = new FormData();
  fd.append("site_name", name);
  fd.append("tagline", document.getElementById("bTagline").value);
  fd.append("project_dir", dir);
  fd.append("admin_user", document.getElementById("bAdminUser").value.trim() || "admin");
  fd.append("admin_pass", pass);
  fd.append("theme_color", document.getElementById("bColor").value);
  fd.append("chat", document.getElementById("bChat").checked ? "on" : "");
  fd.append("git_url", document.getElementById("bGit").value.trim());
  fd.append("git_token", document.getElementById("bToken").value.trim());
  langs.forEach(l => fd.append("langs", l));

  document.getElementById("buildBtn").disabled = true;
  document.getElementById("buildCard").classList.add("hidden");
  document.getElementById("buildProgCard").classList.remove("hidden");
  document.getElementById("buildResultCard").classList.add("hidden");
  document.getElementById("bLog").textContent = "";
  window._bpercent = 0;
  bRenderRing(0);
  document.getElementById("bState").textContent = L.bBuilding;

  fetch("/build/" + currentJob, { method: "POST", body: fd })
    .then(r => r.json())
    .then(d => {
      if (d.build_id) { buildId = d.build_id; pollBuild(); }
      else alert(d.error === "invalid_form" ? L.bInvalidForm : L.bFail);
    })
    .catch(() => alert(L.bFail));
}

function pollBuild() {
  buildTimer = setInterval(() => {
    fetch("/status-build/" + buildId)
      .then(r => r.json())
      .then(d => updateBuildProgress(d))
      .catch(() => {});
  }, 1000);
}

function bRenderRing(p) {
  const ring = document.getElementById("bRing");
  const C = 2 * Math.PI * 57;
  ring.setAttribute("stroke-dashoffset", String(C * (1 - p / 100)));
  document.getElementById("bPct").textContent = p;
}

function updateBuildProgress(d) {
  const p = d.percent || 0;
  window._bpercent = p;
  bRenderRing(p);
  if (d.log && d.log.length) {
    lastBuildMsg = d.log[d.log.length - 1];
    document.getElementById("bStage").textContent = localizeMsg(lastBuildMsg);
    document.getElementById("bState").textContent =
      d.status === "running" ? (L.bBuilding + " — " + localizeMsg(lastBuildMsg))
      : d.status === "done" ? L.bDoneTitle : L.bFail;
    const lg = document.getElementById("bLog");
    lg.innerHTML = d.log.map(k => '<div class="ln"><b>' + String(p).padStart(3) + '%</b> | ' +
      localizeMsg(k).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</div>").join("");
    lg.scrollTop = lg.scrollHeight;
  }
  if (d.done) {
    clearInterval(buildTimer);
    document.getElementById("buildBtn").disabled = false;
    if (d.status === "done" && d.result) showBuildResult(d.result);
    else {
      document.getElementById("buildProgCard").classList.add("hidden");
      document.getElementById("buildResultCard").classList.remove("hidden");
      document.getElementById("bOkBanner").classList.add("hidden");
      document.getElementById("bErrBanner").classList.remove("hidden");
    }
  }
}

function showBuildResult(r) {
  document.getElementById("buildProgCard").classList.add("hidden");
  document.getElementById("buildResultCard").classList.remove("hidden");
  document.getElementById("bErrBanner").classList.add("hidden");
  document.getElementById("bOkBanner").classList.remove("hidden");

  const c = r.counts || {};
  const rows = [
    [c.posts || 0, L.bStPosts],
    [c.pages || 0, L.bStPages],
    [c.terms || 0, L.bStTerms],
    [c.comments || 0, L.bStComments],
    [r.media_copied || 0, L.bStMedia],
  ];
  document.getElementById("bStatsBox").innerHTML = rows.map(x =>
    '<div class="stat"><div class="v">' + x[0] + '</div><div class="k">' + x[1] + "</div></div>"
  ).join("");

  document.getElementById("bCmdDir").textContent = r.project_dir || "";
  document.getElementById("bCmdRun").textContent = (r.project_dir || "") + (L.dir === "rtl" ? "\\run.bat" : "/run.bat");
  document.getElementById("bAdminCred").textContent = adminCredText();

  const g = r.git;
  const el = document.getElementById("bGitStatus");
  if (!g) { el.textContent = L.bGitPending; el.style.color = "var(--muted)"; }
  else if (g.pushed) { el.textContent = L.bGitPushed; el.style.color = "var(--ok)"; }
  else {
    el.textContent = L.bGitFailed + " " + (g.message || "");
    el.style.color = "var(--err)";
  }
  window._previewUrl = null;
}

function adminCredText() {
  const u = document.getElementById("bAdminUser").value.trim() || "admin";
  const p = document.getElementById("bAdminPass").value;
  return "URL: <admin address>/admin   —   " + u + " / " + p;
}

function startPreview() {
  if (!buildId) return;
  fetch("/preview/" + buildId, { method: "POST" })
    .then(r => r.json())
    .then(d => {
      if (d.url) {
        window._previewUrl = d.url;
        window.open(d.url, "_blank");
        const a = document.getElementById("bAdminLink");
        a.href = d.url + "/admin";
        a.classList.remove("hidden");
      }
    })
    .catch(() => {});
}

function resetBuild() {
  buildId = null;
  document.getElementById("buildResultCard").classList.add("hidden");
  document.getElementById("buildProgCard").classList.add("hidden");
  document.getElementById("buildCard").classList.remove("hidden");
}

setLang(LANG);
</script>
